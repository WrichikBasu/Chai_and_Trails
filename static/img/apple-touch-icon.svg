<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Chai &amp; Trails">
  <!-- The home-screen icon is always drawn on an opaque square, so this one brings its own
       board-green ground rather than letting the phone pick black or white behind it.
       Source for apple-touch-icon.png; the PNG is what the page links. -->
  <rect width="180" height="180" fill="#0c5c43"/>
  <g transform="translate(34 30) scale(3.5)">
    <path d="M4 14a12 12 0 0 1 24 0v11.5a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 25.5Z" fill="#f2b01e"/>
    <path d="M16 23V9M10.5 14.5 16 9l5.5 5.5" fill="none" stroke="#0c5c43" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
